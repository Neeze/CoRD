[project]
name = "cord-transformers"
version = "0.1.0"
description = "Hugging Face Transformers integration for the CoRD language model"
requires-python = ">=3.10"
dependencies = [
  "tensorboard>=2.21.0",
  "torch>=2.4",
  "tqdm>=4.67",
  "transformers>=4.56,<5",
]

[project.optional-dependencies]
test = ["pytest>=8", "tensorboard>=2.14"]
kda = ["fla-core>=0.3"]
dev = ["pytest>=8", "tensorboard>=2.14", "fla-core>=0.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
